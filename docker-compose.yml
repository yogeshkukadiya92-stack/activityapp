services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      PORT: 8787
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8787}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      DATABASE_URL: postgresql://cfl_live:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/cfl_live
      DATABASE_SSL: disable
      REDIS_URL: redis://redis:6379
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-CFL Administrator}
      ORGANIZATION_NAME: ${ORGANIZATION_NAME:-Coach For Life}
      ORGANIZATION_SLUG: ${ORGANIZATION_SLUG:-coach-for-life}
      BOOTSTRAP_WORKSHOP: ${BOOTSTRAP_WORKSHOP:-false}
      BOOTSTRAP_DEMO_DATA: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:8787/api/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cfl_live
      POSTGRES_USER: cfl_live
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U cfl_live -d cfl_live"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes","--maxmemory-policy","noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
  redis_data:
